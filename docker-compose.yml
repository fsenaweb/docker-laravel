version: "3"

services:
  db:
    image: mysql:5.7
    restart: unless-stopped
    tty: true
    volumes:
      - ./db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - backend

  app:
    build: .
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker-files/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
    networks:
      - backend

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker-files/nginx/conf.d/local/:/etc/nginx/conf.d
    ports:
      - '80:80'
    depends_on:
      - app
    networks:
      - backend

  phpmyadmin: #this service is optional, remove if necessary
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - '8080:80'
    depends_on:
      - webserver
    networks:
      - backend

volumes:
  db:
    driver: local

networks:
  backend:
    driver: bridge

